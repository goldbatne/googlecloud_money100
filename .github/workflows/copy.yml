name: Drive Backup Copier

on:
  workflow_run:
    workflows: ["GCP Data Lake Archive"]
    types:
      - completed

  workflow_dispatch:

jobs:
  copy_files:
    runs-on: ubuntu-latest

    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install googleapis

      # Step 1
      # AI 학습용 Drive에는 MD만 복사
      - name: Copy MD Files
        env:
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}

          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

          TARGET_GDRIVE_FOLDER_ID: ${{ secrets.TARGET_GDRIVE_FOLDER_ID }}

        run: node copy.js

      # Step 2
      # 공개/열람용 Drive에는 HTML만 복사
      - name: Copy HTML Files
        env:
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}

          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

          PUBLIC_GDRIVE_FOLDER_ID: ${{ secrets.PUBLIC_GDRIVE_FOLDER_ID }}

        run: node copy_public.js

      # Step 3
      # 위 두 복사가 모두 정상 성공했을 때만
      # 오늘자 원본 MD/PDF/HTML을 삭제
      - name: Delete Original Files
        if: ${{ success() }}

        env:
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}

          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

        run: node cleanup_original.js
